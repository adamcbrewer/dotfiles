onboarding = false

[keys]
prefix = "backtick"
focus_agent = "alt+1..9"
new_tab = "prefix+c"
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
split_vertical = "prefix+|"
split_horizontal = "prefix+backslash"

[theme]
name = "tokyo-night"

auto_switch = false
[ui]
sidebar_width = 36
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"

status_indicators = "symbols"
[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon", "workspace"], ["agent", "state_text"]]

[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true
